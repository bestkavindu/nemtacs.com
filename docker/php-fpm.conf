[global]
daemonize = no
error_log = /dev/stderr
log_limit = 8192

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface worker output in the container logs.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Keep the container's env vars visible to PHP (Coolify injects them).
clear_env = no

; Status page used by the FPM ping check.
pm.status_path = /fpm-status
ping.path = /fpm-ping
