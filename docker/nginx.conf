user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # Trust the reverse proxy (Coolify / Traefik) for the real client IP + scheme.
    set_real_ip_from   0.0.0.0/0;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # Log to the container stdout/stderr so Coolify picks them up.
    log_format  main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout main;
    error_log   /dev/stderr warn;

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Long-lived cache for Vite's hashed build output.
        location /build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
            try_files $uri /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param HTTP_PROXY      "";

            fastcgi_buffers        16 16k;
            fastcgi_buffer_size    32k;
            fastcgi_read_timeout   300;
            fastcgi_hide_header    X-Powered-By;
        }

        # Never serve dotfiles (.env, .git, ...) even if one lands in public/.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
